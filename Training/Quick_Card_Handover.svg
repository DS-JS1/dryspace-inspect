<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 595 842"
     role="img" aria-label="Handover quick card: one baton never a copy, and the five handover steps in order.">
  <style>
    .h1{font-weight:700;font-size:21px;font-family:Helvetica,Arial,sans-serif;fill:#FFFFFF}
    .h2{font-weight:400;font-size:10.5px;font-family:Helvetica,Arial,sans-serif;fill:#C6DCEE}
    .brand{font-weight:700;font-size:11px;font-family:Helvetica,Arial,sans-serif;fill:#FFFFFF;letter-spacing:.1em}
    .ver{font-weight:400;font-size:9px;font-family:Courier,monospace;fill:#9FC2DC}
    .rule{font-weight:700;font-size:15px;font-family:Helvetica,Arial,sans-serif;fill:#123A5F;letter-spacing:.03em}
    .ruleb{font-weight:400;font-size:11px;font-family:Helvetica,Arial,sans-serif;fill:#3C4C5A}
    .sec{font-weight:700;font-size:10px;font-family:Helvetica,Arial,sans-serif;fill:#123A5F;letter-spacing:.12em}
    .num{font-weight:700;font-size:12px;font-family:Courier,monospace;fill:#FFFFFF}
    .st{font-weight:700;font-size:13px;font-family:Helvetica,Arial,sans-serif;fill:#14202B}
    .sd{font-weight:400;font-size:10.5px;font-family:Helvetica,Arial,sans-serif;fill:#54626F}
    .stage{font-weight:700;font-size:9px;font-family:Courier,monospace;fill:#123A5F;letter-spacing:.05em}
    .mono{font-weight:400;font-size:10.5px;font-family:Courier,monospace;fill:#14202B}
    .monod{font-weight:400;font-size:9.5px;font-family:Courier,monospace;fill:#6B7A87}
    .warn{font-weight:700;font-size:10.5px;font-family:Helvetica,Arial,sans-serif;fill:#9A6410}
    .foot{font-weight:400;font-size:9px;font-family:Helvetica,Arial,sans-serif;fill:#8593A0}
  </style>

  <rect width="595" height="842" fill="#FFFFFF"/>

  <!-- header -->
  <rect x="0" y="0" width="595" height="88" fill="#123A5F"/>
  <text class="brand" x="32" y="27">DRYSPACE SOLUTIONS</text>
  <text class="h1" x="32" y="56">HANDOVER — QUICK CARD</text>
  <text class="h2" x="32" y="74">Passing an inspection to the next person, without losing it</text>
  <text class="ver" x="563" y="74" text-anchor="end">App v1.3 · Form 4.2</text>

  <!-- the rule -->
  <rect x="32" y="106" width="531" height="58" rx="7" fill="#E8F1FA" stroke="#123A5F" stroke-width="1.4"/>
  <text class="rule" x="48" y="130">ONE BATON, NEVER A COPY</text>
  <text class="ruleb" x="48" y="149">One file is the live record. It lives in SharePoint. Your device copy is a scratch pad.</text>

  <!-- steps -->
  <text class="sec" x="32" y="196">EVERY HANDOVER — FIVE STEPS, IN THIS ORDER</text>
  <rect x="32" y="206" width="531" height="286" rx="7" fill="#FBFCFD" stroke="#DDE5EC" stroke-width="1"/>

  <circle cx="60" cy="240" r="14" fill="#123A5F"/>
  <text class="num" x="60" y="245" text-anchor="middle">1</text>
  <text class="st" x="86" y="237">Set your stage and your name</text>
  <text class="sd" x="86" y="253">At the top of the inspection. This is what stamps the filename and the audit trail.</text>

  <circle cx="60" cy="294" r="14" fill="#123A5F"/>
  <text class="num" x="60" y="299" text-anchor="middle">2</text>
  <text class="st" x="86" y="291">Tap “Share draft”</text>
  <text class="sd" x="86" y="307">At the foot of the form. The app names the file for you — do not rename it.</text>

  <circle cx="60" cy="348" r="14" fill="#123A5F"/>
  <text class="num" x="60" y="353" text-anchor="middle">3</text>
  <text class="st" x="86" y="345">Upload it into current/</text>
  <text class="sd" x="86" y="361">The inspection’s own folder in the Site Inspections library.</text>

  <circle cx="60" cy="402" r="14" fill="#123A5F"/>
  <text class="num" x="60" y="407" text-anchor="middle">4</text>
  <text class="st" x="86" y="399">Move the previous file into archive/</text>
  <text class="sd" x="86" y="415">Straight away — so current/ holds exactly one file again.</text>

  <circle cx="60" cy="456" r="14" fill="#9A6410"/>
  <text class="num" x="60" y="461" text-anchor="middle">5</text>
  <text class="st" x="86" y="453">Then delete your device copy</text>
  <text class="sd" x="86" y="469">Only after steps 3 and 4. Send a LINK to the folder — never the file itself.</text>

  <text class="warn" x="32" y="512">Skipping step 5 is how one job ends up being edited in two places.</text>

  <!-- who holds it next -->
  <text class="sec" x="32" y="552">WHO HOLDS IT NEXT</text>
  <g>
    <rect x="32" y="562" width="80" height="26" rx="5" fill="#E8F1FA" stroke="#123A5F" stroke-width="1"/>
    <text class="stage" x="72" y="579" text-anchor="middle">OFFICE</text>
    <rect x="122" y="562" width="80" height="26" rx="5" fill="#E8F1FA" stroke="#123A5F" stroke-width="1"/>
    <text class="stage" x="162" y="579" text-anchor="middle">FIELD</text>
    <rect x="212" y="562" width="80" height="26" rx="5" fill="#E8F1FA" stroke="#123A5F" stroke-width="1"/>
    <text class="stage" x="252" y="579" text-anchor="middle">TECH</text>
    <rect x="302" y="562" width="80" height="26" rx="5" fill="#E8F1FA" stroke="#123A5F" stroke-width="1"/>
    <text class="stage" x="342" y="579" text-anchor="middle">SALES</text>
    <rect x="392" y="562" width="80" height="26" rx="5" fill="#E8F1FA" stroke="#123A5F" stroke-width="1"/>
    <text class="stage" x="432" y="579" text-anchor="middle">ADMIN</text>
    <rect x="482" y="562" width="81" height="26" rx="5" fill="#E0F2E4" stroke="#1E6B34" stroke-width="1"/>
    <text class="stage" x="522" y="579" text-anchor="middle" fill="#1E6B34">CLOSED</text>
  </g>
  <text class="sd" x="32" y="606">Change the stage BEFORE you export — it is what names the file.</text>

  <!-- where it lives -->
  <text class="sec" x="32" y="644">WHERE IT LIVES — ONE FOLDER PER INSPECTION</text>
  <rect x="32" y="654" width="531" height="106" rx="7" fill="#FBFCFD" stroke="#DDE5EC" stroke-width="1"/>
  <text class="mono" x="48" y="676">Site Inspections ▸ INS-2026-0142 - Smith - 12 Marine Pde, Kirra/</text>
  <text class="mono" x="72" y="697">current/</text>
  <text class="monod" x="190" y="697">one file, ever — the live record</text>
  <text class="mono" x="72" y="716">archive/</text>
  <text class="monod" x="190" y="716">every past handover</text>
  <text class="mono" x="72" y="735">photos/</text>
  <text class="monod" x="190" y="735">the app puts these here by itself</text>
  <text class="warn" x="48" y="754">Two files in current/ means something has gone wrong.</text>

  <!-- filename -->
  <text class="sec" x="32" y="790">THE FILE NAMES ITSELF</text>
  <text class="mono" x="32" y="810">DS_Draft_INS-2026-0142_Smith_S02-FIELD_2026-08-15T1430_JS.json</text>
  <text class="monod" x="32" y="826">job  ·  stage  ·  when  ·  who      — so you can always see which copy is current</text>

  <text class="foot" x="563" y="826" text-anchor="end">Companion to 03_Handover and Version Control Protocol</text>
</svg>
